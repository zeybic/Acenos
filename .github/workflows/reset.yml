name: Weekly Friday Reset
on:
  schedule:
    # Triggered automatically every Friday evening at exactly 18:00 UTC
    - cron: '0 18 * * 5'

jobs:
  reset-data:
    runs-on: ubuntu-latest
    steps:
      - name: Clear Cloud Database and Pre-calculate Week Header
        run: |
          # Calculate the date of the next Monday (Friday + 3 days)
          NEXT_MONDAY=$(date -d "+3 days" +"%d/%m/%Y")
          HEADER_TEXT="📍 Présence Patchwork - La semaine du $NEXT_MONDAY"
          
          curl -X PUT \
            -H "Content-Type: application/json" \
            -H "X-Master-Key: \$2a\$10\$r6wPDv0hgukgXM68NOZjxON2lK4cai1dwE.bNkP/2aK90BO5YJQXe" \
            -d "{\"Monday-AM\":[],\"Monday-PM\":[],\"Tuesday-AM\":[],\"Tuesday-PM\":[],\"Wednesday-AM\":[],\"Wednesday-PM\":[],\"Thursday-AM\":[],\"Thursday-PM\":[],\"Friday-AM\":[],\"Friday-PM\":[],\"currentWeekTitle\":\"$HEADER_TEXT\"}" \
            https://jsonbin.io
