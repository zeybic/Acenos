name: Weekly Friday Reset
on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

jobs:
  reset-data:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.JSONBIN_KEY }}
      MAIN: https://api.jsonbin.io/v3/b/6aec9e37ffd5d16053a942e5
      HIST: https://api.jsonbin.io/v3/b/6aedf5c2ac6210605a72c63b
    steps:
      - name: Archive week then reset
        run: |
          set -e
          WEEK_START=$(date -d "-4 days" +%Y-%m-%d)
          NEXT_MONDAY=$(date -d "+3 days" +%d/%m/%Y)
          HEADER="📍 Présence Patchwork - La semaine du $NEXT_MONDAY"

          CURRENT=$(curl -sf -H "X-Master-Key: $KEY" -H "X-Bin-Meta: false" "$MAIN/latest")
          HISTORY=$(curl -sf -H "X-Master-Key: $KEY" -H "X-Bin-Meta: false" "$HIST/latest")

          echo "$HISTORY" | jq --arg w "$WEEK_START" --argjson d "$CURRENT" \
            '. + {($w): ($d | del(.currentWeekTitle))}' > history.json

          curl -sf -X PUT -H "Content-Type: application/json" \
            -H "X-Master-Key: $KEY" -H "X-Bin-Meta: false" \
            -d @history.json "$HIST"

          jq -n --arg t "$HEADER" '{
            "Lundi-AM":[],"Lundi-PM":[],"Mardi-AM":[],"Mardi-PM":[],
            "Mercredi-AM":[],"Mercredi-PM":[],"Jeudi-AM":[],"Jeudi-PM":[],
            "Vendredi-AM":[],"Vendredi-PM":[],"currentWeekTitle":$t}' > reset.json

          curl -sf -X PUT -H "Content-Type: application/json" \
            -H "X-Master-Key: $KEY" -H "X-Bin-Meta: false" \
            -d @reset.json "$MAIN"
