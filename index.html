<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📍 Office Presence Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: auto; padding: 20px; background-color: #f9f9f9; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; font-weight: bold; }
        .btn-slot { display: block; width: 100%; padding: 10px; text-align: center; cursor: pointer; border: 1px solid #ccc; background: #fafafa; border-radius: 4px; font-size: 16px; }
        .btn-slot.checked { background: #4CAF50; color: white; border-color: #4CAF50; }
        input[type="text"] { padding: 10px; margin-bottom: 15px; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        h2, h3 { margin-top: 20px; color: #111; }
    </style>
</head>
<body>
    <h2>📍 Office Presence - Upcoming Week</h2>
    <table>
        <thead><tr><th>Day</th><th>AM</th><th>PM</th></tr></thead>
        <tbody id="presence-table"></tbody>
    </table>

    <h3>My Attendance</h3>
    <input type="text" id="username" placeholder="👉 Enter your full name here to vote...">
    <table>
        <thead><tr><th>Day</th><th>AM</th><th>PM</th></tr></thead>
        <tbody id="vote-table"></tbody>
    </table>

    <script>
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
        
        const BIN_ID = "6aec9dc3ffd5d16053a94160"; 
        const API_KEY = "$2a$10$r6wPDv0hgukgXM68NOZjxON2lK4cai1dwE.bNkP/2aK90BO5YJQXe"; 

        // Fixed the API URL format completely here
        const API_URL = `https://jsonbin.io{BIN_ID}`;
        let attendance = {};

        async function loadData() {
            try {
                let res = await fetch(`${API_URL}/latest?nocache=${Math.random()}`, {
                    method: 'GET',
                    headers: { 
                        "X-Master-Key": API_KEY,
                        "X-Bin-Meta": "false"
                    }
                });
                if (res.ok) {
                    attendance = await res.json();
                } else {
                    attendance = {};
                }
            } catch (e) { attendance = {}; }
            renderTables();
        }

        function renderTables() {
            let presHTML = "", voteHTML = "";
            const user = document.getElementById("username").value.trim();

            days.forEach(day => {
                const amKey = `${day}-AM`, pmKey = `${day}-PM`;
                const amList = attendance[amKey] || [];
                const pmList = attendance[pmKey] || [];
                
                presHTML += `<tr><td><strong>${day}</strong></td><td>${amList.join(', ') || '–'}</td><td>${pmList.join(', ') || '–'}</td></tr>`;
                
                const amChecked = user && amList.includes(user) ? 'checked' : '';
                const pmChecked = user && pmList.includes(user) ? 'checked' : '';
                
                voteHTML += `<tr>
                    <td>${day}</td>
                    <td><button class="btn-slot ${amChecked}" onclick="toggle('${amKey}')">${amChecked ? '☑ AM' : '☐ AM'}</button></td>
                    <td><button class="btn-slot ${pmChecked}" onclick="toggle('${pmKey}')">${pmChecked ? '☑ PM' : '☐ PM'}</button></td>
                </tr>`;
            });
            document.getElementById("presence-table").innerHTML = presHTML;
            document.getElementById("vote-table").innerHTML = voteHTML;
        }

        async function toggle(slotKey) {
            const user = document.getElementById("username").value.trim();
            if (!user) { alert("Please type your name in the input box before clicking a time slot!"); return; }
            
            if (!attendance[slotKey]) attendance[slotKey] = [];
            if (attendance[slotKey].includes(user)) {
                attendance[slotKey] = attendance[slotKey].filter(u => u !== user);
            } else {
                attendance[slotKey].push(user);
            }
            
            renderTables();
            
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY,
                        'X-Bin-Meta': "false"
                    },
                    body: JSON.stringify(attendance)
                });
            } catch (error) {
                console.error("Cloud upload error:", error);
            }
        }

        document.getElementById("username").addEventListener("input", renderTables);
        loadData();
        
        // Auto-refresh the screen data every 10 seconds so coworkers see each other update live
        setInterval(loadData, 10000);
    </script>
</body>
</html>
